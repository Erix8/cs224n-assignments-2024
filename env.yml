name: cs224n
channels:
  - pytorch
  - nvidia
  - conda-forge
  - huggingface
  - defaults
dependencies:
  - python=3.10
  # --- Assignment 1: word vectors & notebooks ---
  - numpy
  - scikit-learn
  - matplotlib
  - gensim
  - datasets=2.18.0
  - jupyter
  - ipykernel
  # --- Assignments 2-4: PyTorch, NMT & Transformers ---
  - pytorch>=2.1.2
  - torchvision
  - tqdm
  - docopt
  - scipy
  - nltk
  - tensorboard
  - pip
  - pip:
      # --- Assignment 3: NMT helpers ---
      - sentencepiece
      - sacrebleu
      - lxml==5.0.0
# GPU users (e.g. AutoDL RTX 4090, CUDA 12.1): additionally install the toolkit, e.g.
#   conda install nvidia::cuda-toolkit==12.1.1
